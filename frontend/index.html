<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpg" href="./asset/ICON.jpg">
    <title>sacNexus AI</title>
    <link rel="stylesheet" href="./output.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body class="bg-neutral-900 text-white overflow-x-hidden">

    <!-- Logo Container -->

    <div class="fixed top-0 left-0 px-6 py-3 flex items-center gap-3 bg-neutral-900/80 backdrop-blur-md  z-50">

        <!-- Logo -->
        <img src="./asset/LOGO.png" alt="logo" class="w-8 h-8 rounded-md object-cover">

        <!-- Name -->
        <h1 class="text-lg font-semibold tracking-wide text-white">
            sacNexus AI
        </h1>

    </div>

    <!-- Chat Container -->

    <div class="h-screen mx-auto pt-12 max-w-3xl pb-56 px-2 overflow-y-auto flex flex-col no-scrollbar scroll-smooth"
        id="chat_container">

        <!-- User Message Here-->

        <!-- Assistant Message Here-->

    </div>

    <!-- Bottom text area -->

    <div class="fixed inset-x-0 bottom-0 flex items-center justify-center" id="input_box">
        <div class="bg-neutral-800 shadow-2xl border border-neutral-700 p-4 rounded-3xl mb-3 w-full max-w-3xl">
            <textarea class="w-full resize-none p-3 outline-0 max-h-40 no-scrollbar" rows="2"
                placeholder="Ask Anything About Your Company..." id="userinput"></textarea>

            <div class="flex items-end justify-between mt-3">
                <input type="file" id="pdf_upload" accept=".pdf" style="display:none;" />

                <!-- Upload Button -->
                <button type="button" title="Upload PDF" id="upload_btn" class="bg-white text-black w-10 h-10 rounded-full hover:scale-105 transition">
                    <i class="fa-solid fa-file-arrow-up"></i>
                </button>

                <!-- Ask Button -->
                <button type="button" title="Send Message" id="ask_button" class="bg-white text-black rounded-full px-4 py-1 hover:bg-gray-200 transition">
                    <i class="fa-solid fa-arrow-up"></i>
                </button>

            </div>

            <!-- Status Bubble -->
            <div id="upload_status" class="text-sm text-gray-400 mt-2"></div>
        </div>
    </div>

    <script src="./script.js"></script>
</body>

</html>
